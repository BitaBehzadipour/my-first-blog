{% load static %}
<!DOCTYPE html>
<html>
    <head>
        <title>AI in Medicine</title>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
        <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Lobster&subset=latin,latin-ext">
        <link rel="stylesheet" href="{% static 'css/blog.css' %}?v=2">
        <link rel="icon" type="image/png" href="{% static 'images/logo5.png' %}?v=2">
    </head>
    <body>
        
        <header class="page-header">
            <div class="header-content">
        
                <div class="header-top">
                    <div>
                        <h1>
                            <a href="/">AI in Medicine</a>
                        </h1>
        
                        <p class="site-description">
                            Exploring the role of artificial intelligence in modern medicine
                        </p>
                    </div>
        
                    {% if user.is_authenticated %}
                        <a href="{% url 'post_new' %}" class="top-menu">
                            {% include './icons/file-earmark-plus.svg' %}
                        </a>
                    {% endif %}
                </div>
        
                <nav class="main-nav">
                    <a href="/" class="nav-link">Home</a>
                    <a href="#articles" class="nav-link">Articles</a>
                    <a href="#topics" class="nav-link">Topics</a>
                    <a href="#about" class="nav-link">About</a>
                </nav>
        
            </div>
        </header>
       
        
        <main class="content container">
            <div class="row" id="articles">
                <div class="col">
                    {% block content %}
                    {% endblock %}
                </div>
            </div>
        </main>
    </body>
</html>
